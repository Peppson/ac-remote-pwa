; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = wemos_d1_uno32

[env:wemos_d1_uno32]
platform = espressif32 @6.8.1
board = wemos_d1_uno32
framework = arduino
monitor_speed = 115200
upload_speed = 921600
upload_port = COM3
monitor_port = COM3

build_unflags = 
	-std=gnu++11
	-Os

build_flags = 
	-DCORE_DEBUG_LEVEL=0
	-std=gnu++17
	-Wall
	-Wextra
	-Wunused-variable
	-Wshadow
	-O3

extra_scripts = 
	pre:scripts/html_to_cpp_minimized.py
	pre:scripts/icons_to_cpp.py

lib_deps = 
	z3t0/IRremote@4.7.1
	links2004/WebSockets@2.6.1
	pololu/VL53L1X@1.3.1


; Over-The-Air upload
[env:wemos_d1_uno32_ota]
extends = env:wemos_d1_uno32

upload_protocol = espota
upload_port = 192.168.1.210
upload_flags =
	--timeout=80

extra_scripts =
	${env:wemos_d1_uno32.extra_scripts}
	pre:scripts/ota_password_from_secrets.py
