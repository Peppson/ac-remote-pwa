<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport"
    content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <title>Whirlpool</title>
  <meta name="theme-color" content="#141414" />
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Whirlpool" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png?v=2"> <!-- iOS -->
  <link rel="icon" href="icon-192x192.png?v=2"> <!-- Android -->
  <link rel="stylesheet" href="style.css" />
  <script src="script.js" defer></script>
</head>

<body>
  <div class="top-container">
    <div class="title-row">
      <h1 class="title">Whirlpool</h1>

      <button id="powerBtn" type="button" class="power-icon-btn">
        <svg class="btn-icon power-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2v10" />
          <path d="M18.4 6.6a9 9 0 1 1-12.77.04" />
        </svg>
      </button>
    </div>
    <p class="model-name">PACF29CO B</p>
  </div>

  <div id="powerToggleContainer">
    <div class="app-cool-snow">
      <svg class="app-cool-snowflake s1" viewBox="0 0 10 10" fill="none">
        <circle cx="5" cy="5" r="1.7" fill="currentColor" />
      </svg>
      <svg class="app-cool-snowflake s2" viewBox="0 0 10 10" fill="none">
        <circle cx="5" cy="5" r="1.4" fill="currentColor" />
      </svg>
      <svg class="app-cool-snowflake s3" viewBox="0 0 10 10" fill="none">
        <circle cx="5" cy="5" r="1.9" fill="currentColor" />
      </svg>
      <svg class="app-cool-snowflake s4" viewBox="0 0 10 10" fill="none">
        <circle cx="5" cy="5" r="1.5" fill="currentColor" />
      </svg>
      <svg class="app-cool-snowflake s5" viewBox="0 0 10 10" fill="none">
        <circle cx="5" cy="5" r="1.3" fill="currentColor" />
      </svg>
      <svg class="app-cool-snowflake s6" viewBox="0 0 10 10" fill="none">
        <circle cx="5" cy="5" r="1.8" fill="currentColor" />
      </svg>
      <svg class="app-cool-snowflake s7" viewBox="0 0 10 10" fill="none">
        <circle cx="5" cy="5" r="1.6" fill="currentColor" />
      </svg>
      <svg class="app-cool-snowflake s8" viewBox="0 0 10 10" fill="none">
        <circle cx="5" cy="5" r="1.2" fill="currentColor" />
      </svg>
      <svg class="app-cool-snowflake s9" viewBox="0 0 10 10" fill="none">
        <circle cx="5" cy="5" r="1.7" fill="currentColor" />
      </svg>
      <svg class="app-cool-snowflake s10" viewBox="0 0 10 10" fill="none">
        <circle cx="5" cy="5" r="1.5" fill="currentColor" />
      </svg>
      <svg class="app-cool-snowflake s11" viewBox="0 0 10 10" fill="none">
        <circle cx="5" cy="5" r="1.3" fill="currentColor" />
      </svg>
      <svg class="app-cool-snowflake s12" viewBox="0 0 10 10" fill="none">
        <circle cx="5" cy="5" r="1.8" fill="currentColor" />
      </svg>
      <svg class="app-cool-snowflake s13" viewBox="0 0 10 10" fill="none">
        <circle cx="5" cy="5" r="1.4" fill="currentColor" />
      </svg>
      <svg class="app-cool-snowflake s14" viewBox="0 0 10 10" fill="none">
        <circle cx="5" cy="5" r="1.9" fill="currentColor" />
      </svg>
    </div>

    <div class="btn-grid" id="modeGrid">
      <div class="btn-container active" data-mode="Cool">
        <button type="button" class="btn active">
          <svg class="btn-icon cool-mode-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="m10 20-1.25-2.5L6 18" />
            <path d="M10 4 8.75 6.5 6 6" />
            <path d="m14 20 1.25-2.5L18 18" />
            <path d="m14 4 1.25 2.5L18 6" />
            <path d="m17 21-3-6h-4" />
            <path d="m17 3-3 6 1.5 3" />
            <path d="M2 12h6.5L10 9" />
            <path d="m20 10-1.5 2 1.5 2" />
            <path d="M22 12h-6.5L14 15" />
            <path d="m4 10 1.5 2L4 14" />
            <path d="m7 21 3-6-1.5-3" />
            <path d="m7 3 3 6h4" />
          </svg>
        </button>
        <span class="btn-label">Cool</span>
      </div>

      <div class="btn-container" data-mode="Dry">
        <button type="button" class="btn">
          <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2q2 2.5 0 5t0 5 0 5 0 5" />
            <path d="M19 2q2 2.5 0 5t0 5 0 5 0 5" />
            <path d="M5 2q2 2.5 0 5t0 5 0 5 0 5" />
          </svg>
        </button>
        <span class="btn-label">Dry</span>
      </div>

      <div class="btn-container" data-mode="Fan">
        <button type="button" class="btn">
          <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path
              d="M10.827 16.379a6.082 6.082 0 0 1-8.618-7.002l5.412 1.45a6.082 6.082 0 0 1 7.002-8.618l-1.45 5.412a6.082 6.082 0 0 1 8.618 7.002l-5.412-1.45a6.082 6.082 0 0 1-7.002 8.618l1.45-5.412Z" />
            <path d="M12 12v.01" />
          </svg>
        </button>
        <span class="btn-label">Fan</span>
      </div>

      <div class="btn-container" data-mode="Auto">
        <button type="button" class="btn">
          <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8" />
            <path d="M21 3v5h-5" />
            <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16" />
            <path d="M8 16H3v5" />
          </svg>
        </button>
        <span class="btn-label">Auto</span>
      </div>
    </div>

    <div class="temp-container">
      <div class="temp-ring-wrap">
        <svg class="temp-ring-svg" viewBox="0 0 200 200">
          <defs>
            <linearGradient id="tempArcGradient" x1="0" y1="200" x2="200" y2="0" gradientUnits="userSpaceOnUse">
              <stop class="grad-start" offset="0%" stop-color="#007aff" />
              <stop class="grad-end" offset="100%" stop-color="#33AE95" />
            </linearGradient>
          </defs>
          <circle class="temp-ring-track" cx="100" cy="100" r="85" />
          <circle class="temp-ring-fill" id="tempRingFill" cx="100" cy="100" r="85" stroke="url(#tempArcGradient)" />
          <circle class="temp-ring-head" id="tempRingHead" cx="100" cy="100" r="85" stroke="url(#tempArcGradient)" />
        </svg>

        <div class="temp-center">
          <span class="temp-unit hidden">°</span>
          <span class="temp-display" id="tempDisplay">21</span>
          <span class="temp-unit">°</span>
          <p class="temp-mode-text">Mode: Cool</p>
        </div>
      </div>
    </div>

    <p id="status" class="status"></p>

    <div class="btn-grid" id="secondaryModeGrid">
      <div class="btn-container">
        <button id="fanBtn" type="button" class="btn">
          <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path
              d="M10.827 16.379a6.082 6.082 0 0 1-8.618-7.002l5.412 1.45a6.082 6.082 0 0 1 7.002-8.618l-1.45 5.412a6.082 6.082 0 0 1 8.618 7.002l-5.412-1.45a6.082 6.082 0 0 1-7.002 8.618l1.45-5.412Z" />
            <path d="M12 12v.01" />
          </svg>
        </button>
        <span class="btn-label">Fan Speed</span>
      </div>

      <div class="btn-container" data-mode="Lid">
        <button type="button" class="btn">
          <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M12.8 19.6A2 2 0 1 0 14 16H2" />
            <path d="M17.5 8a2.5 2.5 0 1 1 2 4H2" />
            <path d="M9.8 4.4A2 2 0 1 1 11 8H2" />
          </svg>
        </button>
        <span class="btn-label">Lid</span>
      </div>

      <div class="btn-container" data-mode="Sleep">
        <button type="button" class="btn" id="sleepBtn">
          <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path
              d="M20.985 12.486a9 9 0 1 1-9.473-9.472c.405-.022.617.46.402.803a6 6 0 0 0 8.268 8.268c.344-.215.825-.004.803.401" />
          </svg>
        </button>
        <span class="btn-label">Sleep</span>
      </div>

      <div class="btn-container" data-mode="Turbo">
        <button type="button" class="btn">
          <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5" />
            <path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09" />
            <path d="M9 12a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.4 22.4 0 0 1-4 2z" />
            <path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 .05 5 .05" />
          </svg>
        </button>
        <span class="btn-label">Turbo</span>
      </div>
    </div>
  </div>
</body>

</html>
